name: Apply WordMaster UI v9

on:
  push:
    paths:
      - 'wordmaster-ui-v9.css'
      - '.github/workflows/apply-ui-v9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inject UI v9 stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<link rel="stylesheet" href="wordmaster-ui-v9.css?v=20260812">'
          if tag not in s:
              marker='</head>'
              if marker not in s: raise SystemExit('head marker missing')
              s=s.replace(marker,tag+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -F 'wordmaster-ui-v9.css?v=20260812' index.html
          test -f wordmaster-ui-v9.css
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Apply WordMaster UI v9"
            git push origin HEAD:main
          fi
