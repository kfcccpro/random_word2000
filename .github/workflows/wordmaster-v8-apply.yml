name: WordMaster v8 apply

on:
  push:
    branches: [main]
    paths:
      - tools/upgrade_wordmaster_v8.py
      - .github/workflows/wordmaster-v8-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v8 patch
        run: python tools/upgrade_wordmaster_v8.py
      - name: Validate JavaScript and diff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S)
          if not scripts:
              raise SystemExit('No script blocks found')
          Path('/tmp/wordmaster-main.js').write_text(scripts[-1],encoding='utf-8')
          required=['reviewDb','dueReviewIds','activeReviewCount','showWrongMemory','touch-action:manipulation','appVersion:8','schemaVersion:8']
          missing=[x for x in required if x not in html]
          if missing:
              raise SystemExit('Missing v8 markers: '+', '.join(missing))
          PY
          node --check /tmp/wordmaster-main.js
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index.html changes to commit'
          else
            git commit -m 'Upgrade WordMaster to v8 spaced review cycle'
            git push origin HEAD:main
          fi
