name: WordMaster v8 one-shot upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wordmaster-v8-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed v8 patch
        shell: bash
        run: |
          echo '' | base64 --decode | gzip --decompress > /tmp/upgrade_wordmaster_v8.py
          python /tmp/upgrade_wordmaster_v8.py
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S)
          if not scripts:
              raise SystemExit('No script blocks found')
          Path('/tmp/wordmaster-main.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/wordmaster-main.js
          git diff --check
      - name: Commit v8 index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index.html changes to commit'
          else
            git commit -m 'Upgrade WordMaster to v8 review cycle'
            git push origin HEAD:main
          fi
