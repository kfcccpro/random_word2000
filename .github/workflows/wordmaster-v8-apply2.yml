name: WordMaster v8 apply retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wordmaster-v8-apply2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow optional cosmetic markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/upgrade_wordmaster_v8.py')
          s=p.read_text(encoding='utf-8')
          old="    if old not in s:\n        raise SystemExit(f'missing replacement marker: {old[:100]}')\n    s = s.replace(old, new, 1)"
          new="    if old not in s:\n        print(f'optional marker not found: {old[:80]}')\n        return\n    s = s.replace(old, new, 1)"
          if old not in s: raise SystemExit('once() helper shape changed')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply v8 patch
        run: python tools/upgrade_wordmaster_v8.py
      - name: Validate v8
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S)
          Path('/tmp/wordmaster-main.js').write_text(scripts[-1],encoding='utf-8')
          required=['reviewDb','dueReviewIds','activeReviewCount','showWrongMemory','touch-action:manipulation','appVersion:8','schemaVersion:8','Math.min(20,target)','shiftDate(date,1)','shiftDate(date,2)','shiftDate(date,3)']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing v8 markers: '+', '.join(missing))
          if "if(startReviewDue())" in html: raise SystemExit('Old start-review gate still active')
          PY
          node --check /tmp/wordmaster-main.js
          git diff --check
      - name: Commit and push v8
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Upgrade WordMaster to v8 spaced review cycle'
          git push origin HEAD:main
