/* LOGIN */

  const y=hist.get(shiftDate(today,-1)),b=hist.get(shiftDate(today,-2)),parts=[];if(y)parts.push(`어제 ${durationLabel(y)}`);if(b)parts.push(`그저께 ${durationLabel(b)}`);summary.textContent=parts.length?parts.join(' · '):'완료한 날에 소요 시간이 표시됩니다.';

function semanticFamily(w){const m=w.mean.replace(/\s/g,'');for(const [name,keys] of SEMANTIC_RULES)if(keys.some(k=>m.includes(k)))return name;return''}
function prefixOf(word){const w=word.toLowerCase();return PREFIXES.find(p=>w.startsWith(p)&&w.length-p.length>=5)||''}
function suffixOf(word){const w=word.toLowerCase();return SUFFIXES.find(s=>w.endsWith(s)&&w.length-s.length>=4)||''}
function stemOf(word){let w=word.toLowerCase().replace(/[^a-z]/g,'');const p=prefixOf(w);if(p)w=w.slice(p.length);const s=SUFFIXES.find(x=>w.endsWith(x)&&w.length-x.length>=4);if(s)w=w.slice(0,-s.length);return w.replace(/([a-z])\1$/,'$1')}
function meaningTokens(mean){return[...new Set(mean.replace(/[()[\]~·,;/]/g,' ').split(/\s+/).map(x=>x.replace(/하다$|되다$|시키다$|적인$|의$|을$|를$|이$|가$/g,'')).filter(x=>x.length>=2))]}
function editRatio(a,b){const m=a.length,n=b.length;if(!m||!n)return 0;const prev=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){let diag=prev[0];prev[0]=i;for(let j=1;j<=n;j++){const old=prev[j];prev[j]=Math.min(prev[j]+1,prev[j-1]+1,diag+(a[i-1]===b[j-1]?0:1));diag=old}}return 1-prev[n]/Math.max(m,n)}
const FEATURES={},STEM_INDEX=new Map(),SEM_INDEX=new Map(),HEAD_INDEX=new Map(),TOKEN_INDEX=new Map();
function indexPush(map,key,id){if(!key)return;if(!map.has(key))map.set(key,[]);map.get(key).push(id)}
for(const w of WORDS){const f={stem:stemOf(w.word),prefix:prefixOf(w.word),suffix:suffixOf(w.word),sem:semanticFamily(w),tokens:meaningTokens(w.mean),head:w.word.toLowerCase().slice(0,4)};FEATURES[w.id]=f;if(f.stem.length>=4)indexPush(STEM_INDEX,f.stem,w.id);indexPush(SEM_INDEX,f.sem,w.id);indexPush(HEAD_INDEX,f.head,w.id);for(const t of f.tokens)indexPush(TOKEN_INDEX,t,w.id)}
function relationScore(a,b){let score=0;const fa=FEATURES[a.id],fb=FEATURES[b.id];if(fa.stem.length>=4&&fa.stem===fb.stem)score+=8;if(fa.sem&&fa.sem===fb.sem)score+=5;if(fa.prefix&&fa.prefix===fb.prefix)score+=2.2;if(fa.suffix&&fa.suffix===fb.suffix)score+=1.4;const er=editRatio(a.word.toLowerCase(),b.word.toLowerCase());if(er>=.78)score+=4;else if(er>=.66)score+=2;const tb=new Set(fb.tokens);if(fa.tokens.some(t=>tb.has(t)))score+=3;return score}
function relationLabel(cluster){if(cluster.length<2)return'개별 단어';const f=cluster.map(w=>FEATURES[w.id]),stems=f.map(x=>x.stem);if(stems[0].length>=4&&new Set(stems).size===1)return`철자·어형 연결 · ${stems[0]}-`;const shared=f[0].tokens.filter(t=>f.slice(1).every(x=>x.tokens.includes(t)));if(shared.length)return`의미 연결 · ${shared[0]}`;const sems=f.map(x=>x.sem).filter(Boolean);if(sems.length===cluster.length&&new Set(sems).size===1)return`의미 연결 · ${sems[0]}`;const heads=f.map(x=>x.head);if(new Set(heads).size===1)return`철자 유사 · ${heads[0]}-`;const ps=f.map(x=>x.prefix).filter(Boolean);if(ps.length===cluster.length&&new Set(ps).size===1)return`철자 연결 · ${ps[0]}-`;const ss=f.map(x=>x.suffix).filter(Boolean);if(ss.length===cluster.length&&new Set(ss).size===1)return`어형 연결 · -${ss[0]}`;return'철자·의미 연결'}
function relatedCandidates(base,allowed,used){const f=FEATURES[base.id],ids=new Set();for(const arr of [STEM_INDEX.get(f.stem),SEM_INDEX.get(f.sem),HEAD_INDEX.get(f.head),...f.tokens.map(t=>TOKEN_INDEX.get(t))])for(const id of(arr||[]))if(id!==base.id&&allowed.has(id)&&!used.has(id))ids.add(id);return[...ids].map(id=>({w:BY_ID[id],s:relationScore(base,BY_ID[id])})).filter(x=>x.s>=6).sort((a,b)=>b.s-a.s||a.w.word.localeCompare(b.w.word))}
function mixedPriority(date){const byServed=new Map();for(const w of WORDS){const n=S.wordStats[w.id]?.served||0;if(!byServed.has(n))byServed.set(n,[]);byServed.get(n).push(w)}return[...byServed.keys()].sort((a,b)=>a-b).flatMap(n=>seededShuffle(byServed.get(n),`${date}:served:${n}`))}
function buildFairMixedSelection(date,target){
  const tieOrder=seededShuffle(WORDS,`${date}:fair-tie:${target}`),rank=new Map(tieOrder.map((w,i)=>[w.id,i]));
  const pool=WORDS.slice().sort((a,b)=>{
    const as=S.wordStats[a.id]?.served||0,bs=S.wordStats[b.id]?.served||0;if(as!==bs)return as-bs;
    const al=S.wordStats[a.id]?.lastServed||'',bl=S.wordStats[b.id]?.lastServed||'';if(al!==bl)return al.localeCompare(bl);
    return(rank.get(a.id)||0)-(rank.get(b.id)||0);

}
function wrongPriority(date){const buckets={};for(const id of wrongIds()){const r=S.wrongDb[id],k=r.lastFocusDate||'0000-00-00';(buckets[k]||(buckets[k]=[])).push(BY_ID[id])}return Object.keys(buckets).sort().flatMap(k=>seededShuffle(buckets[k].sort((a,b)=>(S.wrongDb[b.id]?.count||0)-(S.wrongDb[a.id]?.count||0)),`${date}:wrong:${k}`))}
function buildGroupedSelection(priority,candidatePool,seed,target){if(target<=0)return[];const allowed=new Set(candidatePool.map(w=>w.id)),used=new Set(),groups=[];let count=0;const groupedTarget=Math.min(target,Math.max(0,Math.round(target*.62)));const add=(base,withRelations)=>{if(used.has(base.id)||count>=target)return false;const room=target-count;let chosen=[];if(withRelations&&room>1)chosen=relatedCandidates(base,allowed,used).slice(0,Math.min(3,room-1)).map(x=>x.w);if(withRelations&&!chosen.length)return false;const cluster=[base,...chosen];for(const w of cluster)used.add(w.id);groups.push({label:relationLabel(cluster),ids:cluster.map(w=>w.id)});count+=cluster.length;return true};for(const base of seededShuffle(priority,`${seed}:group-pass`)){if(count>=groupedTarget)break;add(base,true)}for(const base of priority){if(count>=target)break;add(base,false)}return groups}

function getDailySet(date=localDate()){
  const expected=effectiveDailyCount(date);let existingResult=S.dailyResults[date];
  if(existingResult&&!resultBelongsToDate(existingResult,date)){
    const actual=sessionDateOf(existingResult,'');
    if(actual&&actual!==date){S.dailyResults[actual]=existingResult;if(S.dailySets[date])S.dailySets[actual]=S.dailySets[date]}
    delete S.dailyResults[date];delete S.dailySets[date];delete S.endReviewDone[date];existingResult=null;save({skipCloud:true});
  }
  if(S.dailySets[date]){
    const set=S.dailySets[date],unstarted=!existingResult||(existingResult.currentIndex||0)===0;
    if(date===localDate()&&unstarted&&set.ids?.length!==expected){delete S.dailySets[date];delete S.dailyResults[date];delete S.endReviewDone[date]}
    else{set.target=set.target??set.ids?.length??expected;set.sessionId=set.sessionId||existingResult?.sessionId||('set:'+date+':'+(set.createdAt||Date.now()));if(!Array.isArray(set.directions)||set.directions.length!==set.ids.length)set.directions=buildDirections(set.ids.length,date,set.enKoPercent??configuredEnKo());return set}
  }
  const target=expected,createdAt=new Date().toISOString(),sessionId='session:'+date+':'+createdAt+':'+Math.random().toString(36).slice(2,8);
  if(target===0){S.dailySets[date]={date,sessionId,mode:'off',target:0,ids:[],groups:[],directions:[],enKoPercent:configuredEnKo(),catchUp:false,createdAt};save();return S.dailySets[date]}
  const mode='mixed',groups=buildFairMixedSelection(date,target);
  const ids=groups.flatMap(g=>g.ids).slice(0,target),enKoPercent=configuredEnKo(),directions=buildDirections(ids.length,date,enKoPercent),catchUp=target===160&&catchUpRequiredFor(S,date);
  S.dailySets[date]={date,sessionId,mode,target:ids.length,requestedTarget:target,ids,groups,directions,enKoPercent,catchUp,createdAt};save();return S.dailySets[date];
}
function peekTodaySet(){return S.dailySets[localDate()]||null}
function groupForIndex(set,index){let p=0;for(let i=0;i<set.groups.length;i++){const g=set.groups[i];if(index<p+g.ids.length)return{...g,no:i+1};p+=g.ids.length}return{label:'개별 단어',no:0,ids:[]}}
function getResult(date=localDate()){const r=S.dailyResults[date]||null;return resultBelongsToDate(r,date)?r:null}
function ensureResult(date=localDate()){
  const set=getDailySet(date);
  if(!S.dailyResults[date])S.dailyResults[date]={date,sessionId:set.sessionId||('session:'+date+':'+new Date().toISOString()),mode:set.mode,target:set.ids.length,startedAt:new Date().toISOString(),currentIndex:0,correct:0,answers:[],wrongIds:[],quizFinished:false,finishedAt:''};
  save();return S.dailyResults[date];
}
function recordAttempt(id,ok,date){const st=S.wordStats[id]||{served:0,correct:0,wrong:0,lastServed:''};st.served=(st.served||0)+1;st.lastServed=date;if(ok)st.correct=(st.correct||0)+1;else st.wrong=(st.wrong||0)+1;S.wordStats[id]=st;if(!ok){const r=S.wrongDb[id]||{count:0,firstWrong:date,lastWrong:date,reviewCount:0,lastFocusDate:''};r.count=(r.count||0)+1;r.firstWrong=r.firstWrong||date;r.lastWrong=date;S.wrongDb[id]=r}}
function pendingStartReview(date=localDate()){const candidates=Object.keys(S.dailyResults||{}).filter(d=>d<date).sort().reverse();for(const sourceDate of candidates){const r=S.dailyResults[sourceDate];if(!r?.quizFinished||!r.wrongIds?.length)continue;if(S.startReviewedSources?.[sourceDate])return null;if(S.startReviewDone?.[date]&&sourceDate===shiftDate(date,-1))return null;return{sourceDate,ids:r.wrongIds.filter(id=>BY_ID[id])}}return null}

function drawAdminHistory(rows,q){const box=document.getElementById('adminHistoryList'),per=30,pages=Math.max(1,Math.ceil(rows.length/per));adminHistoryPage=clamp(adminHistoryPage,1,pages);const slice=rows.slice((adminHistoryPage-1)*per,adminHistoryPage*per);if(!slice.length){box.innerHTML=`<div class="empty"><div class="empty-icon">▤</div>${q?'검색 결과가 없습니다.':'학습 이력이 없습니다.'}</div>`;return}box.innerHTML=`<div class="table-wrap"><table class="data-table"><thead><tr><th>날짜</th><th>모드</th><th>학습량</th><th>영→한</th><th>한→영</th><th>정답</th><th>오답</th><th>정확도</th><th>완료 시각</th></tr></thead><tbody>${slice.map(historyRowHtml).join('')}</tbody></table></div><div class="pager"><button class="btn btn-secondary small" onclick="changeAdminHistoryPage(-1)" ${adminHistoryPage===1?'disabled':''}>이전</button><span>${adminHistoryPage} / ${pages}</span><button class="btn btn-secondary small" onclick="changeAdminHistoryPage(1)" ${adminHistoryPage===pages?'disabled':''}>다음</button></div>`;box.dataset.rows=JSON.stringify(rows)}
function changeAdminHistoryPage(delta){const box=document.getElementById('adminHistoryList');let rows=[];try{rows=JSON.parse(box.dataset.rows||'[]')}catch(e){}adminHistoryPage+=delta;drawAdminHistory(rows,'')}

function progressRows(query='',sort='id',state=adminState()){let rows=WORDS.map(w=>{const st=state.wordStats?.[w.id]||{};return{...w,served:st.served||0,correct:st.correct||0,wrong:st.wrong||0,lastServed:st.lastServed||'',wrongDb:state.wrongDb?.[w.id]?.count||0,accuracy:percent(st.correct||0,(st.correct||0)+(st.wrong||0))}});const q=query.toLowerCase();if(q)rows=rows.filter(r=>r.word.toLowerCase().includes(q)||r.mean.toLowerCase().includes(q));if(sort==='served')rows.sort((a,b)=>b.served-a.served||a.id-b.id);else if(sort==='wrong')rows.sort((a,b)=>b.wrongDb-a.wrongDb||b.wrong-a.wrong);else if(sort==='accuracy')rows.sort((a,b)=>a.accuracy-b.accuracy||b.served-a.served);else rows.sort((a,b)=>a.id-b.id);return rows}
function renderAdminProgress(){const A=adminState(),root=document.getElementById('viewAdminProgress'),m=aggregateMetrics(A);root.innerHTML=`${adminLearnerSwitcher()}<div class="grid g3" style="margin-bottom:15px"><div class="card"><div class="stat-label">학습 경험 단어</div><div class="stat-value">${m.seen}</div><div class="stat-note">전체 ${TOTAL}개 중 ${m.coverage}%</div></div><div class="card"><div class="stat-label">미학습 단어</div><div class="stat-value">${TOTAL-m.seen}</div><div class="stat-note">아직 응답 기록 없음</div></div><div class="card"><div class="stat-label">누적 정확도</div><div class="stat-value">${m.accuracy}%</div><div class="stat-note">정답 ${m.correct} · 오답 ${m.wrong}</div></div></div><div class="card"><div class="section-head"><div><div class="section-title">단어별 진도</div><div class="section-sub">학습 횟수, 정답률, 최근 학습일, 오답 DB 누적</div></div><div class="data-actions"><input class="search" id="progressSearch" placeholder="단어 또는 뜻 검색" oninput="filterAdminProgress()"><select class="select" id="progressSort" onchange="filterAdminProgress()"><option value="id">번호순</option><option value="served">학습 횟수순</option><option value="wrong">오답 누적순</option><option value="accuracy">낮은 정답률순</option></select><button class="btn btn-secondary small" onclick="exportProgressCSV()">CSV 저장</button></div></div><div id="adminProgressList"></div></div>`;adminProgressPage=1;drawAdminProgress(progressRows('','id',A),'');renderSyncIndicator()}
function filterAdminProgress(){adminProgressPage=1;const q=document.getElementById('progressSearch').value.trim(),sort=document.getElementById('progressSort').value;drawAdminProgress(progressRows(q,sort),q)}
function drawAdminProgress(rows,q){const box=document.getElementById('adminProgressList'),per=50,pages=Math.max(1,Math.ceil(rows.length/per));adminProgressPage=clamp(adminProgressPage,1,pages);const slice=rows.slice((adminProgressPage-1)*per,adminProgressPage*per);if(!slice.length){box.innerHTML=`<div class="empty"><div class="empty-icon">◎</div>${q?'검색 결과가 없습니다.':'진도 데이터가 없습니다.'}</div>`;return}box.innerHTML=`<div class="table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>단어</th><th>뜻</th><th>학습</th><th>정답</th><th>오답</th><th>정답률</th><th>오답 DB</th><th>최근 학습</th></tr></thead><tbody>${slice.map(r=>`<tr><td>${r.id}</td><td class="strong">${escapeHtml(r.word)}</td><td>${escapeHtml(r.mean)}</td><td>${r.served}</td><td class="good">${r.correct}</td><td class="bad">${r.wrong}</td><td>${r.served?r.accuracy+'%':'-'}</td><td class="bad">${r.wrongDb}</td><td>${escapeHtml(r.lastServed||'-')}</td></tr>`).join('')}</tbody></table></div><div class="pager"><button class="btn btn-secondary small" onclick="changeAdminProgressPage(-1)" ${adminProgressPage===1?'disabled':''}>이전</button><span>${adminProgressPage} / ${pages}</span><button class="btn btn-secondary small" onclick="changeAdminProgressPage(1)" ${adminProgressPage===pages?'disabled':''}>다음</button></div>`;box.dataset.rows=JSON.stringify(rows)}
function changeAdminProgressPage(delta){const box=document.getElementById('adminProgressList');let rows=[];try{rows=JSON.parse(box.dataset.rows||'[]')}catch(e){}adminProgressPage+=delta;drawAdminProgress(rows,'')}

function renderAdminSettings(){
  const root=document.getElementById('viewAdminSettings'),t=todayStatus(),bytes=new Blob([JSON.stringify(S)]).size,storagePct=Math.min(100,Math.round(bytes/(5*1024*1024)*100)),canRebuild=!t.res||t.answered===0,pct=configuredEnKo(),dc=directionCounts(configuredCount(),pct),cloudOk=cloudConfigured()&&cloudSignedIn()&&!CLOUD.lastError;
  root.innerHTML=`<div class="grid g2"><div class="card red-edge"><div class="section-title">일일 학습량 · 출제 방향</div><div class="section-sub">기본 학습량은 0~150개입니다. 완료 후에도 새로운 세트를 추가로 시작할 수 있습니다.</div><div class="setting-row"><div><div class="setting-label">하루 출제 단어 수</div><div class="setting-desc">같은 횟수의 단어 중 가장 오래 출제되지 않은 단어가 먼저 배정됩니다.</div></div><div class="count-control"><input class="range" id="dailyRange" type="range" min="0" max="150" step="1" value="${configuredCount()}" oninput="syncDailyCount(this.value)"><input class="number-input" id="dailyNumber" type="number" min="0" max="150" value="${configuredCount()}" oninput="syncDailyCount(this.value)"></div></div><div class="ratio-box"><div class="ratio-head"><div><div class="setting-label">영→한 / 한→영 비율</div></div><div class="ratio-numbers"><span class="ratio-chip"><b id="enKoCount">${dc.enKo}</b>영→한</span><span class="ratio-chip"><b id="koEnCount">${dc.koEn}</b>한→영</span></div></div><input class="range" id="ratioRange" type="range" min="0" max="100" step="1" value="${pct}" oninput="syncDirectionRatio(this.value)"><div class="ratio-bar"><i class="enko" id="enKoBar" style="width:${pct}%"></i><i class="koen" id="koEnBar" style="width:${100-pct}%"></i></div><div class="progress-meta" style="margin-top:8px"><span>영→한 <b id="enKoPct">${pct}</b>%</span><span>한→영 <b id="koEnPct">${100-pct}</b>%</span></div></div><div class="data-actions" style="margin-top:16px"><button class="btn btn-primary" onclick="saveLearningSettings()">학습 설정 저장</button><button class="btn btn-secondary" onclick="rebuildTodaySet()" ${canRebuild?'':'disabled'}>미시작 세션 재생성</button></div></div><div class="card"><div class="section-title">저장 상태</div><div class="section-sub">로컬 저장과 공유 Firebase 저장을 자동으로 병합합니다.</div><div class="status-list" style="margin-top:13px"><div class="status-row"><span>앱 버전</span><strong>v7 Auto Sync</strong></div><div class="status-row"><span>데이터 크기</span><strong>${(bytes/1024).toFixed(1)} KB</strong></div><div class="status-row"><span>완료 세션</span><strong>${S.history.length}회</strong></div><div class="status-row"><span>기기 동기화</span><strong style="color:${cloudOk?'var(--green)':'var(--muted)'}">${cloudOk?'자동 연결됨':'재연결 중'}</strong></div><div class="status-row"><span>최근 동기화</span><strong>${formatDateTime(CLOUD.lastSyncAt)}</strong></div></div><div class="storage-meter"><div class="progress-meta"><span>로컬 저장 사용량</span><span>${storagePct}%</span></div><div class="storage-bar"><i style="width:${storagePct}%"></i></div></div></div></div><div class="card" style="margin-top:15px"><div class="section-head"><div><div class="section-title">PC·아이패드 자동 동기화</div><div class="section-sub">학생은 어느 기기에서든 8081만 입력합니다. 관리자 모드에서 별도 로그인할 필요가 없습니다.</div></div><div class="cloud-status"><span class="cloud-dot ${cloudOk?'ok':CLOUD.lastError?'err':''}"></span>${cloudOk?'연결됨':'확인 중'}</div></div><div class="field-grid"><div class="field"><label>공유 학습자 이름</label><input class="text-input" id="cloudLearnerName" value="${escapeHtml(CLOUD.learnerName)}"></div><div class="field"><label>현재 기기 이름</label><input class="text-input" id="cloudDeviceName" value="${escapeHtml(CLOUD.deviceName)}" placeholder="집 PC 또는 아이패드"></div></div><label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:11px;color:var(--muted)"><input id="cloudAuto" type="checkbox" ${CLOUD.autoSync?'checked':''}> 답안이 바뀔 때마다 자동 동기화</label><div class="cloud-toolbar" style="margin-top:15px"><button class="btn btn-primary small" onclick="saveCloudSettings(true)">설정 저장·지금 동기화</button><button class="btn btn-secondary small" onclick="cloudPullState(true)">공유 진도 새로고침</button><button class="btn btn-secondary small" onclick="cloudPushState(true)">현재 진도 병합 저장</button><span id="syncIndicator" class="sync-badge">연결 확인</span></div>${CLOUD.lastError?`<div class="alert danger-note" style="margin-top:14px"><b>연결 점검:</b> ${escapeHtml(CLOUD.lastError)}</div>`:`<div class="info" style="margin-top:14px">기존 아이패드 로컬 진도와 종전 Firebase 계정 진도도 자동 병합 대상으로 처리합니다.</div>`}</div><div class="card" style="margin-top:15px"><div class="section-title">데이터 관리</div><div class="data-actions" style="margin-top:14px"><button class="btn btn-secondary small" onclick="exportJSON()">전체 백업 JSON</button><label class="btn btn-secondary small file-label">백업 복원<input type="file" accept="application/json,.json" onchange="importJSON(event)"></label><button class="btn btn-secondary small" onclick="exportHistoryCSV()">학습 이력 CSV</button><button class="btn btn-secondary small" onclick="exportProgressCSV()">단어 진도 CSV</button><button class="btn btn-secondary small" onclick="exportWrongCSV()">오답 DB CSV</button></div></div><div class="card" style="margin-top:15px"><div class="section-title">초기화</div><div class="section-sub">복구가 필요하면 먼저 JSON 백업을 저장하십시오.</div><div class="data-actions" style="margin-top:14px"><button class="btn btn-danger small" onclick="rebuildTodaySet()" ${canRebuild?'':'disabled'}>미시작 오늘 세션 초기화</button><button class="btn btn-danger small" onclick="resetAllLearningData()">전체 학습 데이터 초기화</button></div></div>`;
  renderSyncIndicator();
}

function updateRatioPreview(){const total=clamp(parseInt(document.getElementById('dailyNumber')?.value,10)||0,0,150),pct=clamp(parseInt(document.getElementById('ratioRange')?.value,10)||0,0,100),dc=directionCounts(total,pct);for(const [id,val] of [['enKoCount',dc.enKo],['koEnCount',dc.koEn],['enKoPct',pct],['koEnPct',100-pct]]){const el=document.getElementById(id);if(el)el.textContent=val}const a=document.getElementById('enKoBar'),b=document.getElementById('koEnBar');if(a)a.style.width=pct+'%';if(b)b.style.width=(100-pct)+'%'}
function syncDailyCount(v){const n=clamp(parseInt(v,10)||0,0,150);const r=document.getElementById('dailyRange'),x=document.getElementById('dailyNumber');if(r)r.value=n;if(x)x.value=n;updateRatioPreview()}
function syncDirectionRatio(v){const n=clamp(parseInt(v,10)||0,0,100),r=document.getElementById('ratioRange');if(r)r.value=n;updateRatioPreview()}
function saveLearningSettings(){const n=clamp(parseInt(document.getElementById('dailyNumber').value,10)||0,0,150),pct=clamp(parseInt(document.getElementById('ratioRange').value,10)||0,0,100),t=todayStatus();S.settings.dailyCount=n;S.settings.enKoPercent=pct;if(!t.res||t.answered===0){delete S.dailySets[localDate()];delete S.dailyResults[localDate()];delete S.endReviewDone[localDate()];save();toast(`오늘부터 ${n}개 · 영→한 ${pct}% 적용`)}else{save();toast(`설정 저장 · 다음 새 세션부터 적용`)}renderAdminSettings()}
async function saveCloudSettings(test=false){
  CLOUD.learnerName=document.getElementById('cloudLearnerName')?.value.trim()||'학습자';
  CLOUD.deviceName=document.getElementById('cloudDeviceName')?.value.trim()||'이 기기';
  CLOUD.autoSync=document.getElementById('cloudAuto')?.checked!==false;CLOUD.lastError='';saveCloudConfigLocal();
  if(test){await firebaseConnect(false);await cloudPushState(true)}renderAdminSettings();
}

function rebuildTodaySet(){const t=todayStatus();if(t.res&&t.answered>0){toast('진행 중 세션은 초기화할 수 없습니다.');return}if(!confirm('오늘 생성된 세션을 삭제하고 현재 설정으로 다시 생성합니까?'))return;delete S.dailySets[localDate()];delete S.dailyResults[localDate()];delete S.endReviewDone[localDate()];save();toast('오늘 세션 재생성 준비 완료');renderAdminSettings()}
function resetAllLearningData(){if(!confirm('모든 학습 이력, 진도, 오답 DB를 삭제합니다. 계속합니까?'))return;const settings={...S.settings};S=defaultState();S.settings=settings;S.meta.legacyImported=true;save();toast('전체 학습 데이터 초기화');renderAdminSettings();updateChrome()}

function download(name,content,type){const b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500)}
function csvCell(v){return'"'+String(v??'').replace(/"/g,'""')+'"'}
function exportJSON(){const A=CURRENT_ROLE==='admin'?adminState():S;download(`wordmaster_backup_${localDate()}.json`,JSON.stringify(A,null,2),'application/json');toast('전체 백업 저장')}
function exportHistoryCSV(){const A=CURRENT_ROLE==='admin'?adminState():S,rows=[['date','mode','total','en_to_ko','ko_to_en','correct','wrong','accuracy','duration_minutes','catch_up','started_at','finished_at'],...(A.history||[]).map(h=>[h.date,h.mode,h.total,h.enKo??'',h.koEn??'',h.correct,h.wrong,percent(h.correct,h.total),h.durationMinutes||elapsedMinutes(h.startedAt,h.finishedAt),h.catchUp?'yes':'no',h.startedAt||'',h.finishedAt||''])];download(`wordmaster_history_${localDate()}.csv`,'\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8');toast('학습 이력 CSV 저장')}
function exportProgressCSV(){const rows=[['id','word','meaning','served','correct','wrong','accuracy','wrong_db_count','last_served'],...progressRows().map(r=>[r.id,r.word,r.mean,r.served,r.correct,r.wrong,r.served?r.accuracy:'',r.wrongDb,r.lastServed])];download(`wordmaster_progress_${localDate()}.csv`,'\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8');toast('단어 진도 CSV 저장')}
function exportWrongCSV(){const A=CURRENT_ROLE==='admin'?adminState():S,rows=[['id','word','meaning','wrong_count','first_wrong','last_wrong','review_count']];for(const id of wrongIdsFor(A).sort((a,b)=>(A.wrongDb[b].count||0)-(A.wrongDb[a].count||0))){const w=BY_ID[id],r=A.wrongDb[id];rows.push([id,w.word,w.mean,r.count,r.firstWrong,r.lastWrong,r.reviewCount||0])}download(`wordmaster_wrong_db_${localDate()}.csv`,'\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8');toast('오답 DB CSV 저장')}
function importJSON(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||!o.wrongDb||!o.dailySets)throw new Error('invalid');S=normalizeState(o);save();updateChrome();toast('백업 복원 완료');setView(CURRENT_ROLE==='admin'?'adminDashboard':'today')}catch(err){toast('올바른 백업 파일이 아닙니다.')}};rd.readAsText(f);e.target.value=''}

document.getElementById('pinInput').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);e.target.classList.remove('error');if(e.target.value.length===4)submitPin()});
document.getElementById('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitPin()});
document.addEventListener('keydown',e=>{if(CURRENT_ROLE!=='learner'||currentView!=='today'||quizLocked)return;if(['1','2','3','4'].includes(e.key)&&document.querySelectorAll('.option').length)answerQuestion(+e.key-1)});
async function startFirebaseOnReady(){
  if(!cloudConfigured()){CLOUD_STARTUP='local';renderLoginWeek();return false}
  try{await initCloudClient();await ensureCloudUser();return await cloudBootstrap(false)}
  catch(e){CLOUD_STARTUP='error';CLOUD.lastError=e.message||String(e);saveCloudConfigLocal();renderLoginWeek();return false}
}
async function checkDateRollover(force=false){const now=localDate();if(!ACTIVE_DATE)ACTIVE_DATE=now;if(!force&&now===ACTIVE_DATE)return;ACTIVE_DATE=now;S=normalizeState(S);localStorage.setItem(KEY,JSON.stringify(S));if(cloudSignedIn())await cloudPullState(false);renderLoginWeek();if(CURRENT_ROLE&&currentView)setView(currentView)}
async function bootApp(){
  ACTIVE_DATE=localDate();CLOUD_STARTUP=cloudConfigured()?'loading':'local';renderLoginWeek();renderSyncIndicator();
  if(window.WMFirebase)await startFirebaseOnReady();else await new Promise(resolve=>window.addEventListener('wmFirebaseReady',()=>startFirebaseOnReady().finally(resolve),{once:true}));
  const remembered=sessionStorage.getItem('wm_role');if(remembered==='admin')enterRole('admin');else if(remembered==='learner')enterRole('learner');else{sessionStorage.removeItem('wm_role');setTimeout(()=>document.getElementById('pinInput').focus(),30)}
  renderLoginWeek();
}
window.addEventListener('pageshow',()=>checkDateRollover(true));window.addEventListener('focus',()=>checkDateRollover(false));document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDateRollover(true)});setInterval(()=>checkDateRollover(false),30000);bootApp();
</script>
